name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit stable toolchain
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain versions
        run: |
          moon version --all
          moonrun --version

      - name: Enforce MoonBit compiler minimum
        run: python3 tools/check_moonc_version.py --min 0.10.14

      - name: Verify formatting
        shell: bash
        run: |
          moon fmt
          git diff --exit-code

      - name: Enforce conservative source threshold
        run: python3 tools/count_effective_moonbit.py --check-core 2000

      - name: Check all backends
        run: |
          moon check --target wasm-gc --deny-warn
          moon check --target wasm --deny-warn
          moon check --target js --deny-warn
          moon check --target native --deny-warn

      - name: Build library
        run: moon build --target wasm-gc

      - name: Run tests on portable backends
        run: |
          moon test --target wasm-gc
          moon test --target js
          moon test --target native

      - name: Run end-to-end examples
        run: |
          moon run examples/inspect
          moon run examples/filter
          moon run examples/roundtrip
